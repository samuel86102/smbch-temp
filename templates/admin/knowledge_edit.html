{% extends "base_admin.html" %}
{% block title %}{{ '編輯' if filename else '新增' }}知識文件 | 後台{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto px-6 py-12">
    <a href="/admin/knowledge" class="text-sm text-secondary hover:text-primary transition"><i class="fas fa-arrow-left mr-1"></i>返回知識庫</a>
    <h1 class="text-2xl font-bold text-primary mt-4 mb-8">{{ '編輯知識文件' if filename else '新增知識文件' }}</h1>

    <form method="post" action="/admin/knowledge/edit" class="space-y-6">
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">分類</label>
                {% if filename %}
                <input type="hidden" name="category" value="{{ category }}">
                <input value="{{ category }}" disabled class="w-full border border-gray-200 rounded-lg px-4 py-2.5 bg-gray-50 text-gray-500">
                {% else %}
                <select name="category" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40">
                    {% for c in categories %}
                    <option value="{{ c.id }}" {{ 'selected' if c.id == category else '' }}>{{ c.name }} ({{ c.id }})</option>
                    {% endfor %}
                </select>
                {% endif %}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">檔名</label>
                {% if filename %}
                <input type="hidden" name="filename" value="{{ filename }}">
                <input value="{{ filename }}" disabled class="w-full border border-gray-200 rounded-lg px-4 py-2.5 bg-gray-50 text-gray-500">
                {% else %}
                <input name="filename" required placeholder="例如：聚會時間" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40">
                <p class="text-xs text-gray-400 mt-1">不需加副檔名，系統會自動存成 .md</p>
                {% endif %}
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">內容（Markdown）</label>
            <textarea name="content" rows="20" placeholder="# 標題&#10;&#10;在這裡輸入內容…" class="w-full border border-gray-200 rounded-lg px-4 py-3 font-mono text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-primary/40">{{ content }}</textarea>
        </div>

        <div class="flex gap-3">
            <button class="bg-primary text-white px-6 py-2.5 rounded-full font-medium hover:bg-secondary transition shadow">儲存</button>
            <a href="/admin/knowledge" class="px-6 py-2.5 rounded-full font-medium text-gray-500 hover:bg-gray-100 transition">取消</a>
        </div>
    </form>
</section>
{% endblock %}
